<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clawd Saver</title>
<style>
  /* Same palette as the saver, so the two do not look like different programs. */
  :root {
    --bg:    #14120F;
    --panel: #1F1B17;
    --line:  #332D26;
    --text:  #F0EEE6;
    --dim:   #9A9185;
    --coral: #D77757;
    --gem:   #45A8A0;
  }
  /* The form scrolls at every font size now, so the scrollbar is permanent
     furniture. Without this it is WebView2's light one on a dark dialog. */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    gap: 13px;
    padding: 18px 20px;
    /* A settings dialog is not a document; dragging a selection across it is
       never what anyone meant to do. */
    user-select: none;
    cursor: default;
  }
  h2 { margin: 0 0 2px; font-size: 14px; font-weight: 600; }
  h2 + .sub { margin-bottom: 9px; }
  .sub { margin: 0; font-size: 12px; color: var(--dim); }
  /* Two groups no longer fit a fixed window at every font size, so the whole
     form scrolls and the buttons stay put below it. */
  .scroll {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    padding: 4px;
    margin: -4px;
  }
  .scroll h2:not(:first-child) { margin-top: 15px; }
  /* The scrolling happens one level up, on .scroll, so a group can be its own
     natural height. The padding there is not decoration: setting overflow on
     one axis makes the other a scroll container too, which clips anything drawn
     outside the padding box — including the focus ring. It has to clear the
     ring's whole extent, outline-offset plus outline-width, 2 + 2. */
  .options { display: flex; flex-direction: column; gap: 8px; }
  .opt {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 11px 13px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    cursor: pointer;
  }
  .opt:hover { border-color: #4A4238; }
  .opt.sel { border-color: var(--coral); background: #241C17; }
  .dot {
    flex: none;
    width: 12px; height: 12px;
    border: 2px solid var(--dim);
    border-radius: 50%;
  }
  .opt.sel .dot { border-color: var(--coral); background: var(--coral); }
  .name { font-weight: 600; }
  .note { margin-left: auto; font-size: 12px; color: var(--dim); }
  .row { display: flex; gap: 8px; justify-content: flex-end; }
  button {
    font: inherit;
    padding: 7px 17px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }
  button:hover { border-color: #4A4238; }
  button.primary {
    background: var(--coral);
    border-color: var(--coral);
    color: #1A120D;
    font-weight: 600;
  }
  :focus-visible { outline: 2px solid var(--gem); outline-offset: 2px; }
</style>
</head>
<body>
  <div class="scroll">
    <h2>How much spend should the counter show?</h2>
    <p class="sub">All of them end today. The calendar ones start over when the
      period does; the rolling ones never reset.</p>
    <div class="options" id="periods"></div>

    <h2>What should Clawd be doing?</h2>
    <p class="sub">Random picks again every time the screensaver starts.</p>
    <div class="options" id="scenes"></div>
  </div>
  <div class="row">
    <button id="cancel" type="button">Cancel</button>
    <button id="save" type="button" class="primary">Save</button>
  </div>

<script>
(() => {
  'use strict';

  // Keys must match Period::key() and SceneChoice::key() in settings.rs. The
  // host round-trips them without interpreting them, so a mismatch here is an
  // option the saver ignores — which config.rs has a test against.
  const PERIODS = [
    { key: '1d',  name: 'Today',        note: 'today only'          },
    { key: 'wtd', name: 'This week',    note: 'since the week began' },
    { key: 'mtd', name: 'This month',   note: 'since the 1st'       },
    { key: '7d',  name: 'Last 7 days',  note: 'rolling'             },
    { key: '30d', name: 'Last 30 days', note: 'rolling'             },
  ];
  const SCENES = [
    { key: 'random',  name: 'Surprise me',   note: 'a different one each start' },
    { key: 'mine',    name: 'Mining',        note: 'pickaxe and ore'    },
    { key: 'forge',   name: 'The forge',     note: 'watching it burn'   },
    { key: 'rack',    name: 'Server rack',   note: 'what you pay for'   },
    { key: 'dock',    name: 'Night fishing', note: 'waiting on a bite'  },
    { key: 'printer', name: 'The receipt',   note: 'longer as you spend' },
    { key: 'belt',    name: 'Parcel line',   note: 'stamp, repeat'      },
    { key: 'uplink',  name: 'The uplink',    note: 'talking to something' },
  ];

  // One radio group, built from a list. Two of them now, and the second is the
  // reason this is a function rather than a run of statements.
  function group(hostId, options, stored, fallback) {
    let selected = options.some(o => o.key === stored) ? stored : fallback;
    const host = document.getElementById(hostId);
    host.setAttribute('role', 'radiogroup');

    const rows = options.map((opt, i) => {
      const el = document.createElement('div');
      el.className = 'opt';
      el.tabIndex = 0;
      el.setAttribute('role', 'radio');
      el.innerHTML =
        '<span class="dot"></span><span class="name"></span><span class="note"></span>';
      el.querySelector('.name').textContent = opt.name;
      el.querySelector('.note').textContent = opt.note;
      el.addEventListener('click', () => api.select(i));
      host.appendChild(el);
      return el;
    });

    const api = {
      rows,
      key: () => selected,
      select(i) {
        selected = options[i].key;
        api.paint();
        rows[i].focus();
      },
      paint() {
        options.forEach((opt, i) => {
          const on = opt.key === selected;
          rows[i].classList.toggle('sel', on);
          rows[i].setAttribute('aria-checked', String(on));
        });
      },
      selectedRow: () => rows[options.findIndex(o => o.key === selected)],
      focusSelected() { api.selectedRow().focus(); },
      step(target, by) {
        const at = rows.indexOf(target);
        const from = at >= 0 ? at : options.findIndex(o => o.key === selected);
        api.select((from + by + options.length) % options.length);
      },
    };
    api.paint();
    return api;
  }

  // The host injects the stored choices. Falling back the same way the saver
  // does when settings.json is missing means the dialog can never show a
  // selection the saver would not act on.
  const periods = group('periods', PERIODS, window.CLAWD_PERIOD, '1d');
  const scenes = group('scenes', SCENES, window.CLAWD_SCENE, 'mine');
  const groups = [periods, scenes];
  const owner = target => groups.find(g => g.rows.indexOf(target) >= 0);

  // Opened straight in a browser there is no host to talk to. Guarding here
  // keeps the page inspectable without it throwing on every click.
  const send = msg => { if (window.ipc) window.ipc.postMessage(msg); };
  // JSON rather than a delimiter, because there are two fields now and there
  // may one day be three.
  const commit = () => send('save:' + JSON.stringify({ period: periods.key(), scene: scenes.key() }));
  const dismiss = () => send('close');

  document.getElementById('save').addEventListener('click', commit);
  document.getElementById('cancel').addEventListener('click', dismiss);

  addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.preventDefault(); dismiss(); return; }
    if (e.key === 'Enter') {
      // Enter on a focused button is already that button's own action. Running
      // the global shortcut as well would make Enter on Cancel save first and
      // close second, which is the one thing Cancel promises not to do — so
      // leave buttons to themselves and keep the shortcut for the option rows.
      if (e.target && e.target.tagName === 'BUTTON') return;
      e.preventDefault();
      commit();
      return;
    }
    const step = e.key === 'ArrowDown' ? 1 : e.key === 'ArrowUp' ? -1 : 0;
    if (!step) return;
    // Same carve-out as Enter, for the same reason. An arrow pressed while Save
    // or Cancel has focus would otherwise pull focus back into a list and
    // change the selection on the way — quietly altering what a subsequent
    // Enter would store.
    if (e.target && e.target.tagName === 'BUTTON') return;
    // Arrows move within whichever group holds focus, so the two never fight
    // over one keypress. With focus nowhere in particular, the periods lead.
    e.preventDefault();
    (owner(e.target) || periods).step(e.target, step);
  });

  // Thirteen options do not fit, so the scene group starts below the fold. Left
  // alone, someone who chose the last scene opens Settings on a list with no
  // selection visible in it, which reads as the setting having been lost.
  // Scrolled first, then focus, so the period group is what the keyboard has.
  scenes.selectedRow().scrollIntoView({ block: 'nearest' });
  periods.focusSelected();
})();
</script>
</body>
</html>
