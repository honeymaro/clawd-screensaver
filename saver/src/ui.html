<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clawd Saver</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #14120F; }
  body { display: flex; align-items: center; justify-content: center; cursor: none; }
  canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
  <canvas id="stage"></canvas>

<script>
(() => {
  'use strict';

  // ── Stage ────────────────────────────────────────────────
  // Wider and taller than the standalone miner page: the amount needs a row of
  // its own above the scene, and the aspect ratio is pushed towards 16:10 so a
  // full-screen display is not left with huge side margins.
  const W = 112, H = 74;

  // Clawd's own parts stay in the 48-unit space of the reference SVG and are
  // shifted into place by DX/DY, so the pixel alignment never has to be
  // re-derived. DY leaves room for the amount row plus the dollar sign's
  // overhanging stem.
  const DX = 13, DY = 19;
  const OX = 4 + DX, OY = -1 + DY;   // 48-unit reference space -> stage
  const BASE = 47 + DY;              // ground line: feet and ore rest here

  // Widest the amount row may draw. Centred text, plus the stale marker three
  // units past it, plus three units of burn-in drift, all have to stay inside
  // the stage — which works out at 96 units. It matters because the counter can
  // be set to a 30-day total: five figures on a heavy month, and "$12345.67" is
  // 99 units at the normal scale, so it would hang off the right edge.
  const AMOUNT_MAX_W = 96;

  // Dark palette. A full-screen cream background is punishing at night, and
  // dark also costs less on an OLED panel.
  //
  // Only what the stage and Clawd himself need lives here; a scene's own
  // materials belong to that scene. WOOD and the two steels are the exception,
  // because a handle and a metal edge turn up in more than one of them.
  const BG        = '#14120F';
  const CORAL     = '#D77757';
  const EYE       = '#1F1A17';
  const HELMET    = '#DFA23B';
  const LAMP_BX   = '#7A5518';
  const LAMP      = '#FFF1C2';
  const WOOD      = '#8B5E3C';
  const STEEL     = '#7E858A';
  const STEEL_L   = '#AAB1B5';
  // Not a drop shadow. On a near-black background there is nothing darker to
  // shade with, so the ground is a faintly lighter bar instead.
  const SHADOW    = '#241F1A';
  const AMOUNT    = '#F0EEE6';
  const AMOUNT_D  = '#6E675D';

  // Parts from the reference SVG (48-unit space)
  const BODY = { x: 6, y: 18, w: 36, h: 24 };
  const EYES = [{ x: 12, y: 24, w: 3, h: 6 }, { x: 33, y: 24, w: 3, h: 6 }];
  const LEGS = [9, 15, 30, 36].map(x => ({ x, y: 39, w: 3, h: 9 }));
  const ARM_L = { x: 0, y: 33, w: 7.5, h: 6 };
  const ARM_R = { x: 40.5, y: 33, w: 7.5, h: 6 };

  // 3x5 bitmap glyphs. The period is deliberately one column wide so "$33.47"
  // does not read with a gap in the middle.
  const FONT = {
    '0': ['111', '101', '101', '101', '111'],
    '1': ['010', '110', '010', '010', '111'],
    '2': ['111', '001', '111', '100', '111'],
    '3': ['111', '001', '111', '001', '111'],
    '4': ['101', '101', '111', '001', '001'],
    '5': ['111', '100', '111', '001', '111'],
    '6': ['111', '100', '111', '101', '111'],
    '7': ['111', '001', '001', '001', '001'],
    '8': ['111', '101', '111', '101', '111'],
    '9': ['111', '101', '111', '001', '111'],
    // Seven rows rather than five. A dollar sign squeezed into the digit body
    // is just a blocky S — the stem has to overhang above and below to read as
    // currency. drawText centres over-tall glyphs automatically.
    '$': ['010', '111', '110', '111', '011', '111', '010'],
    '.': ['0', '0', '0', '0', '1'],
    '-': ['000', '000', '111', '000', '000'],
  };

  // ── Renderer ─────────────────────────────────────────────
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  let S = 10;   // device pixels per unit; kept even so half-units stay integral

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const byW = window.innerWidth * 0.94 * dpr / W;
    const byH = window.innerHeight * 0.92 * dpr / H;
    S = Math.max(2, Math.floor(Math.min(byW, byH) / 2) * 2);
    canvas.width = W * S;
    canvas.height = H * S;
    canvas.style.width = (W * S / dpr) + 'px';
    canvas.style.height = (H * S / dpr) + 'px';
    ctx.imageSmoothingEnabled = false;
  }

  // Burn-in protection: the whole scene wanders by a few whole units every half
  // minute or so. Whole units only, so the pixel grid never breaks.
  let driftX = 0, driftY = 0, nextDrift = 0;
  function updateDrift(now) {
    if (now < nextDrift) return;
    nextDrift = now + 25000 + Math.random() * 15000;
    driftX = Math.round((Math.random() * 2 - 1) * 3);
    driftY = Math.round((Math.random() * 2 - 1) * 2);
  }

  const rect = (x, y, w, h, fill) => {
    ctx.fillStyle = fill;
    ctx.fillRect((x + driftX) * S, (y + driftY) * S, w * S, h * S);
  };
  // For parts still expressed in the 48-unit reference space. `dx` is for the
  // one scene that stands Clawd somewhere other than where every other scene
  // does; it is zero everywhere else.
  const part = (p, dy, fill, dx = 0) =>
    rect(p.x + OX + dx, p.y + OY + dy, p.w, p.h, fill);

  // Half-unit grid snap. Every coordinate a swung tool produces goes through
  // this, so an even S still puts each block on whole device pixels.
  const snap = v => Math.round(v * 2) / 2;

  // Lays 3-unit blocks along a line at 1.5-unit spacing. Stepping a full 3 units
  // on a diagonal makes consecutive blocks meet at their corners only, which
  // reads as a row of loose squares rather than a shaft; spacing them by half a
  // block guarantees they overlap at every angle.
  function blockLine(x0, y0, x1, y1, steps, fill, from = 1) {
    for (let i = from; i <= steps; i++) {
      const t = i / steps;
      rect(snap(x0 + (x1 - x0) * t) - 1.5, snap(y0 + (y1 - y0) * t) - 1.5, 3, 3, fill);
    }
  }

  // ── Usage state ──────────────────────────────────────────
  // Secondary displays are handed CLAWD_STATIC by the host so they paint one
  // frame and then stop, instead of running a renderer per monitor at full tilt.
  const STATIC = window.CLAWD_STATIC === true;

  // The host seeds this from its on-disk cache so the counter is populated on
  // the first frame; a ccusage run takes several seconds.
  let usage = window.CLAWD_SEED || { cost: null, state: 'error' };
  let celebrateUntil = 0;

  window.CLAWD_USAGE = function (next) {
    const before = usage && typeof usage.cost === 'number' ? usage.cost : null;
    usage = next;
    if (before !== null && typeof next.cost === 'number' && next.cost > before + 1e-9) {
      // Real money was spent since the last poll. Set the scene off right now
      // rather than waiting for its cycle to come round.
      celebrateUntil = performance.now() + 1400;
      scene.celebrate(performance.now());
    }
    // A static display repaints only here, so this is also its only chance to
    // move: without it the one surface most likely to show a near-identical
    // image all night is the one getting no burn-in protection at all.
    if (STATIC) {
      updateDrift(performance.now());
      draw(performance.now());
    }
  };

  function amountGlyphs() {
    if (usage && typeof usage.cost === 'number') return '$' + usage.cost.toFixed(2);
    return '$--.--';
  }
  function amountColor(now) {
    if (now < celebrateUntil) return scene.accent;   // flash when spend goes up
    if (!usage) return AMOUNT_D;
    if (usage.state === 'ok') return AMOUNT;
    // A refresh running over a figure we already have should not dim it every
    // ten seconds — that number is still the current one.
    if (usage.state === 'loading' && typeof usage.cost === 'number') return AMOUNT;
    return AMOUNT_D;
  }

  // ── Shared animation ─────────────────────────────────────
  const reduced = STATIC || matchMedia('(prefers-reduced-motion: reduce)').matches;
  let blinkUntil = 0, nextBlink = 1500, doubled = false;
  const bits = [];
  let lastT = 0;

  function spawn(x, y, n, palette, spread, lift) {
    // `stepBits` is the only thing that ever culls these, and it does not run
    // when motion is off. Debris thrown on a path that never advances it would
    // sit at its spawn point and accumulate for as long as the saver is up —
    // invisible, since every piece lands on the same coordinate, and unbounded.
    if (reduced) return;
    for (let i = 0; i < n; i++) {
      bits.push({
        x, y,
        vx: (Math.random() * 2 - 1) * spread,
        vy: -Math.random() * lift - 10,
        c: palette[(Math.random() * palette.length) | 0],
      });
    }
  }

  function stepBits(dt) {
    for (let i = bits.length - 1; i >= 0; i--) {
      const b = bits[i];
      b.vy += 190 * dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      if (b.y > BASE || b.x < -4 || b.x > W + 4) bits.splice(i, 1);
    }
  }

  function stepBlink(now) {
    if (now <= nextBlink) return;
    blinkUntil = now + 110;
    if (!doubled && Math.random() < 0.22) { nextBlink = now + 320; doubled = true; }
    else { nextBlink = now + 3000 + Math.random() * 3200; doubled = false; }
  }

  // ── Drawing ──────────────────────────────────────────────
  function drawText(text, x, y, scale, fill) {
    let cx = x;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      const rows = FONT[ch];
      if (!rows) { cx += 4 * scale; continue; }
      const w = rows[0].length;
      // Glyphs taller than the five-row digit body hang evenly above and below
      // it, so the dollar sign's stem overshoots the way a real one does.
      const dy = (5 - rows.length) / 2 * scale;
      // `fill` may be a function so a single glyph can be picked out — used to
      // run a light along the dashes while a fetch is in flight.
      const paint = typeof fill === 'function' ? fill(i, ch) : fill;
      for (let r = 0; r < rows.length; r++) {
        for (let c = 0; c < w; c++) {
          if (rows[r][c] === '1') {
            rect(cx + c * scale, y + dy + r * scale, scale, scale, paint);
          }
        }
      }
      cx += (w + 1) * scale;
    }
  }
  function textWidth(text, scale) {
    let w = 0;
    for (const ch of text) w += ((FONT[ch] ? FONT[ch][0].length : 3) + 1) * scale;
    return w - scale;   // no trailing gap
  }

  // Largest scale the text still fits at. Only five figures and up drop below 3,
  // so a day or a week renders exactly as it always did.
  function amountScale(text) {
    for (const s of [3, 2]) if (textWidth(text, s) <= AMOUNT_MAX_W) return s;
    return 1;
  }

  function drawAmount(now) {
    const text = amountGlyphs();
    const scale = amountScale(text);
    const width = textWidth(text, scale);
    const x = Math.floor((W - width) / 2);
    // Hold the row's centre line where it sits at scale 3, so a shrunken
    // five-figure month is not also stranded high above the scene. Half units
    // are safe: S is always even.
    const y = 13.5 - 2.5 * scale;
    const state = usage ? usage.state : 'error';

    // With no figure to show yet, a static "$--.--" is indistinguishable from a
    // permanent failure — and on the first launch of a new day the cache is
    // date-stale, so that is exactly what every morning looked like. Run a light
    // along the dashes instead, so the wait reads as work in progress.
    if (state === 'loading' && text.indexOf('-') !== -1) {
      const dashAt = [];
      for (let i = 0; i < text.length; i++) if (text[i] === '-') dashAt.push(i);
      const lit = dashAt[Math.floor(now / 200) % dashAt.length];
      drawText(text, x, y, scale, i => (i === lit ? AMOUNT : AMOUNT_D));
    } else {
      drawText(text, x, y, scale, amountColor(now));
    }

    // A dim marker when the figure on screen is not from a fresh ccusage run.
    if (state !== 'ok' && state !== 'loading') rect(x + width + 3, y, 2, 2, AMOUNT_D);
  }

  // Headgear, one per scene. The hard hat and its lamp used to be drawn inside
  // drawClawd, which is how Clawd came to turn up at a printer and on a jetty in
  // mining kit. It is costume, not anatomy.
  //
  // Every crown lives between y 26 and the top of the body at 36. The amount row
  // reaches y 24 at its tallest and drifts with everything else, so a couple of
  // units of clearance is what keeps a hat out of the counter for good. The
  // headset's boom and the headband's tails are the two pieces that hang lower.
  const LEATHER = '#5A4132', GOG = '#8FA3B0', GOG_D = '#2E2823';
  const CUP     = '#3E454B', CUP_L = '#6E757B';
  const STRAW   = '#C2A263', STRAW_D = '#9B7F49';
  const BAND    = '#2B3B33', VISOR = '#4E9E6A', VISOR_D = '#2F6B45';
  const DENIM   = '#4A5C74', DENIM_D = '#36455A';
  const WOOL    = '#8A4A5B', WOOL_D = '#6B3745';
  const TIE     = '#C0483F', TIE_D = '#8E332C', KNOT = '#E8E2D4';
  const CAP     = '#8A5A2B', CAP_D = '#6A4420', CAP_L = '#A87340';

  // Each takes the bob and the same `dx` Clawd is standing at, and folds both
  // into a local `r` so the coordinates below stay readable as the flat numbers
  // they are.
  const HAT = {
    // Brim, dome, head lamp. No halo behind the lamp: a translucent rectangle
    // overhanging the dome just reads as a misaligned box.
    helmet: (bob, dx) => {
      const r = (x, y, w, h, c) => rect(x + dx, y + bob, w, h, c);
      r(19, 33, 44, 3, HELMET);
      r(25, 27, 32, 6, HELMET);
      r(36, 28, 10, 5, LAMP_BX);
      r(38, 29, 6, 3, LAMP);
    },
    // Pushed up onto the brow rather than worn, which is where goggles live
    // between one piece of work and the next.
    goggles: (bob, dx) => {
      const r = (x, y, w, h, c) => rect(x + dx, y + bob, w, h, c);
      r(21, 32, 40, 4, LEATHER);
      r(25, 30, 12, 6, GOG_D);
      r(45, 30, 12, 6, GOG_D);
      r(27, 31, 8, 3, GOG);
      r(47, 31, 8, 3, GOG);
    },
    headset: (bob, dx) => {
      const r = (x, y, w, h, c) => rect(x + dx, y + bob, w, h, c);
      r(27, 28, 28, 3, STEEL);
      r(23, 30, 6, 8, CUP);
      r(53, 30, 6, 8, CUP);
      r(24, 32, 4, 4, CUP_L);
      r(54, 32, 4, 4, CUP_L);
      // The boom hangs off the near cup and has to touch it. Left to float it
      // is a stick and a ball in the air beside his chin.
      r(23, 36, 2, 6, CUP);
      r(18, 41, 6, 1, STEEL);
      r(15, 40, 3, 3, CUP_L);
    },
    // Wider and floppier than the hard hat, and no lamp: the silhouette is the
    // whole difference at this size.
    straw: (bob, dx) => {
      const r = (x, y, w, h, c) => rect(x + dx, y + bob, w, h, c);
      r(15, 32, 52, 4, STRAW);
      r(27, 27, 28, 5, STRAW);
      r(27, 30, 28, 2, STRAW_D);
    },
    // A print room eyeshade: a band and a peak, and deliberately no dome.
    visor: (bob, dx) => {
      const r = (x, y, w, h, c) => rect(x + dx, y + bob, w, h, c);
      r(25, 29, 32, 4, BAND);
      r(19, 33, 44, 3, VISOR);
      r(19, 35, 44, 1, VISOR_D);
    },
    cap: (bob, dx) => {
      const r = (x, y, w, h, c) => rect(x + dx, y + bob, w, h, c);
      r(25, 28, 32, 8, DENIM);
      r(25, 33, 32, 3, DENIM_D);
      r(57, 33, 8, 3, DENIM);                // the peak, and the asymmetry
    },
    beanie: (bob, dx) => {
      const r = (x, y, w, h, c) => rect(x + dx, y + bob, w, h, c);
      r(27, 27, 28, 9, WOOL);
      r(25, 29, 32, 7, WOOL);
      r(25, 32, 32, 4, WOOL_D);              // the folded band
    },
    // A headband, tails trailing. No crown, which is what separates it from the
    // visor, and the tails run the opposite way from the cap's peak so the two
    // asymmetric hats are not the same asymmetry. Flush with the body and not
    // white: a pale bar wider than his head is the brightest thing on the stage
    // after the counter, and it reads as a plank resting on him.
    headband: (bob, dx) => {
      const r = (x, y, w, h, c) => rect(x + dx, y + bob, w, h, c);
      r(23, 32, 36, 2, TIE);
      r(23, 34, 36, 2, TIE_D);
      r(38, 32, 6, 3, KNOT);                 // the disc, sunk into the band
      r(19, 34, 4, 2, TIE);                  // tails, short and falling away
      r(16, 36, 4, 2, TIE_D);                // meeting the first, not near it
    },
    // A hunting cap with the flaps down. It is as close to a dog's ears as Clawd
    // gets without stopping being Clawd, and the crown is deliberately low: that
    // scene lifts him ten units out of the grass, and a tall one would take the
    // counter's two units of clearance with it.
    hunter: (bob, dx) => {
      const r = (x, y, w, h, c) => rect(x + dx, y + bob, w, h, c);
      r(25, 29, 32, 7, CAP);
      r(25, 34, 32, 2, CAP_L);
      // The flaps hang past his head on both sides and well below it. A brim
      // all the way round instead was a plank laid across him, and the flaps
      // are the only part that says hunting rather than hat.
      r(19, 34, 6, 12, CAP_D);
      r(57, 34, 6, 12, CAP_D);
    },
  };

  // Clawd himself is shared. Every scene puts him somewhere, hands him a
  // different thing to do and dresses him for it, but he is the reason this is
  // Clawd Saver and not a generic counter, so his proportions do not vary.
  //
  // The options are all for one scene each, which is why they are options:
  // `standing` off for a scene where he is not on his feet (those draw their own
  // legs, dangling being the only part that changes), `dx` for the one that
  // stands him somewhere other than where the rest do, and `armLDY` for the one
  // where the far arm does something too.
  function drawClawd(bob, armDY, blinking, hat, opts = {}) {
    const dx = opts.dx || 0;
    if (opts.standing !== false) LEGS.forEach(l => part(l, 0, CORAL, dx));
    part(ARM_L, bob + (opts.armLDY || 0), CORAL, dx);
    part(ARM_R, bob + armDY, CORAL, dx);
    part(BODY, bob, CORAL, dx);

    hat(bob, dx);

    // Eyes hold a fixed +1 unit gaze towards whatever he is working on.
    EYES.forEach(e => {
      if (blinking) rect(e.x + OX + dx + 1, e.y + OY + bob + 3, e.w, 1, EYE);
      else rect(e.x + OX + dx + 1, e.y + OY + bob, e.w, e.h, EYE);
    });
  }

  // ── Scenes ───────────────────────────────────────────────
  //
  // A scene owns everything below the amount row: its own materials, its own
  // prop, and what it does when the figure goes up. Everything above — the
  // stage, the amount row, the drift, the particles and Clawd — is shared,
  // because that is what makes them the same program rather than four.
  //
  // Three members and an optional fourth: `accent`, `celebrate(now)` and
  // `draw(now, blinking)`, plus a `step(now, dt)` only for a scene with state to
  // advance. Three rules:
  //
  //   `step` advances and draws nothing.
  //   `draw` draws and advances nothing, and reads nothing but `now`, the
  //     figure on screen, and what `celebrate` last set — so a frame drawn
  //     without a step before it is a real frame rather than a stale one. The
  //     figure counts because the host sets it, not `step`: a display that
  //     repaints only when it changes repaints exactly when it changes.
  //   Every rectangle stays inside the stage at a drift of ±3 by ±2, unless it
  //     is a backdrop that spans the whole stage at every drift.
  //
  // The second rule is the one that costs something to keep, and it is the one
  // that earns it. A secondary display paints a single frame and then repaints
  // only when the figure changes, and `prefers-reduced-motion` is honoured by
  // never calling `step` at all. Anything cached in `step` is frozen on both
  // paths — which is why poses are derived from `now` inside `draw` rather than
  // stored, and why a scene says "gone until this moment" instead of "gone".

  // Swinging, shared by the two scenes that hit something. One set of timings,
  // because two would drift apart.
  const SWING = [
    { step: [3, -3],   armDY: -4.5 },   // 0 wind-up
    { step: [3, -1.5], armDY: -3   },   // 1 mid
    { step: [3, 0],    armDY: 0    },   // 2 strike
    { step: [3, -1],   armDY: -1.5 },   // 3 recoil
  ];
  const SWING_CYCLE = 1150;
  const swingPose = now => {
    const ph = now % SWING_CYCLE;
    return ph < 400 ? 0 : ph < 470 ? 1 : ph < 680 ? 2 : ph < 820 ? 3 : 0;
  };
  const swingBob = pose => (pose === 2 ? 1 : pose === 0 ? -1 : 0);

  function makeMine() {
    const ROCK   = '#6F6862';
    const ROCK_D = '#57514B';
    const GEM    = '#45A8A0';
    const GEM_L  = '#86D6CF';
    const CRACK  = '#17140F';

    // Ore block. 6x6 cells of 3 units = 18x18.
    const RX = 64 + DX, RY = 29 + DY, CELL = 3;
    const ROCK_MAP = [
      '001000',
      '023010',
      '122000',
      '000123',
      '012200',
      '000100',
    ];
    const ROCK_FILL = { '0': ROCK, '1': ROCK_D, '2': GEM, '3': GEM_L };

    const CRACKS = [
      [[7.5, 0, 1.5, 4.5], [9, 4.5, 1.5, 3], [7.5, 7.5, 1.5, 3]],
      [[9, 10.5, 1.5, 4.5], [3, 6, 4.5, 1.5], [10.5, 9, 4.5, 1.5], [4.5, 13.5, 1.5, 4.5]],
    ];

    // The ore is away for GONE after it breaks and pops back in over the POP
    // that follows. Held as the moment it broke rather than as a flag, because
    // only `step` could ever clear a flag — and a display that never steps would
    // be left with Clawd swinging at bare ground for the rest of the night.
    const GONE = 450, POP = 130;
    let prevPose = 0, crack = 0, shatterAt = -1e9, joltUntil = 0;
    const rockGone = now => now - shatterAt < GONE;

    function shatter(now) {
      // Idempotent: two rises inside the same 450 ms would otherwise throw two
      // sets of debris and push the respawn further out each time.
      if (rockGone(now)) return;
      shatterAt = now;
      crack = 0;
      spawn(RX + 9, RY + 9, 22, [GEM, GEM_L, ROCK, ROCK_D], 26, 46);
    }

    function impact(now) {
      if (rockGone(now)) return;
      joltUntil = now + 90;
      crack++;
      spawn(RX, 36 + DY, 8, [STEEL_L, GEM_L, ROCK], 24, 32);
      if (crack >= 3) shatter(now);
    }

    function drawRock(now) {
      if (rockGone(now)) return;
      const jx = now < joltUntil ? 1 : 0;
      if (now - shatterAt < GONE + POP) { rect(RX + 3 + jx, RY + 6, 12, 12, ROCK); return; }

      for (let r = 0; r < 6; r++) {
        for (let c = 0; c < 6; c++) {
          rect(RX + c * CELL + jx, RY + r * CELL, CELL, CELL, ROCK_FILL[ROCK_MAP[r][c]]);
        }
      }
      for (let s = 0; s < crack && s < CRACKS.length; s++) {
        for (const [x, y, w, h] of CRACKS[s]) rect(RX + x + jx, RY + y, w, h, CRACK);
      }
    }

    function drawPick(bob, p) {
      const hx = 52 + DX, hy = 35 + DY + bob + p.armDY;
      const [sx, sy] = p.step;
      const cx = hx + sx * 4, cy = hy + sy * 4;

      blockLine(hx, hy, cx, cy, 8, WOOD);

      // The head is a short bar laid perpendicular to the handle, which is what
      // makes it read as a pickaxe instead of a lump stuck on the end.
      const len = Math.hypot(sx, sy);
      const px = -sy / len * 3, py = sx / len * 3;
      blockLine(cx - px, cy - py, cx + px, cy + py, 4, STEEL, 0);
      rect(snap(cx + px) - 1.5, snap(cy + py) - 1.5, 3, 1.5, STEEL_L);
    }

    return {
      accent: GEM_L,
      celebrate: shatter,
      // Only the strike edge needs remembering; the pose itself is the clock.
      step(now) {
        const pose = swingPose(now);
        if (pose === 2 && prevPose !== 2) impact(now);
        prevPose = pose;
      },
      draw(now, blinking) {
        const pose = swingPose(now);
        const p = SWING[pose];
        const bob = swingBob(pose);
        const lift = bob < 0 ? 2 : 0;

        rect(12 + DX + lift, BASE, 32 - lift * 2, 1.5, SHADOW);
        if (!rockGone(now)) rect(RX + 1.5, BASE, 15, 1.5, SHADOW);

        drawRock(now);
        drawClawd(bob, p.armDY, blinking, HAT.helmet);
        drawPick(bob, p);
      },
    };
  }

  function makeForge() {
    const IRON    = '#4A4340';
    const IRON_L  = '#6B625C';
    const IRON_D  = '#2E2A28';
    const MOUTH   = '#140F0C';
    const EMBER   = '#E2591B';
    const FLAME   = '#F5952A';
    const FLAME_L = '#FFD264';
    const HOT     = '#FFF3C4';
    const COAL    = '#241F1D';

    // Furnace. The mouth is where every flame row has to stay, flare included.
    const FX = 74, FY = 40, FW = 24, FH = 26;
    const MX = 78, MY = 44, MW = 16, MH = 20;
    const CENTRE = MX + MW / 2;

    // Four rows of fire, widest at the bottom. Widths are even so each row
    // stays centred on a whole unit.
    const ROWS = [
      { y: 58, h: 6, w: 14, c: EMBER },
      { y: 53, h: 5, w: 10, c: FLAME },
      { y: 49, h: 4, w: 8,  c: FLAME_L },
      { y: 45, h: 4, w: 4,  c: HOT },
    ];

    let prevPose = 0, flareUntil = 0;

    // Deterministic flicker. Random would look no better and would make the
    // geometry check's replay meaningless.
    const flick = (now, r) => (Math.floor(now / 90) + r * 3) % 3 - 1;

    function drawFurnace(now) {
      rect(FX, FY, FW, FH, IRON);
      rect(FX - 2, FY - 3, FW + 4, 3, IRON_L);      // top lip
      rect(83, FY - 10, 6, 7, IRON_D);              // chimney
      rect(81, FY - 12, 10, 2, IRON_L);             // chimney cap
      rect(MX, MY, MW, MH, MOUTH);

      const flaring = now < flareUntil;
      for (let r = 0; r < ROWS.length; r++) {
        const row = ROWS[r];
        // Clamped, because the widest row plus a flicker plus a flare is 18
        // against a 16-unit mouth — two units of fire drawn over the iron. Every
        // term is even, so the clamp cannot knock a row off its whole unit.
        const w = Math.min(row.w + flick(now, r) * 2 + (flaring ? 2 : 0), MW);
        const h = flaring && r === ROWS.length - 1 ? row.h + 2 : row.h;
        const y = flaring && r === ROWS.length - 1 ? row.y - 1 : row.y;
        rect(CENTRE - w / 2, y, w, h, row.c);
      }
      // Grate bars across the mouth, so the fire has something to sit on.
      for (let i = 0; i < 3; i++) rect(MX + 2 + i * 5, MY + MH - 2, 2, 2, IRON_D);
    }

    function drawShovel(bob, p) {
      const hx = 52 + DX, hy = 35 + DY + bob + p.armDY;
      const [sx, sy] = p.step;
      const cx = hx + sx * 4, cy = hy + sy * 4;

      blockLine(hx, hy, cx, cy, 8, WOOD);

      // A shovel is a pickaxe's opposite: the head is a flat pan on the end
      // rather than a bar across it, so it is drawn along the handle, not
      // perpendicular to it.
      const len = Math.hypot(sx, sy);
      const ux = sx / len, uy = sy / len;
      blockLine(cx, cy, cx + ux * 3, cy + uy * 3, 3, STEEL, 0);
      rect(snap(cx + ux * 3) - 2, snap(cy + uy * 3) - 1, 4, 2, STEEL_L);
    }

    return {
      accent: FLAME_L,
      celebrate(now) {
        flareUntil = now + 1400;
        spawn(CENTRE, MY + 4, 20, [EMBER, FLAME, FLAME_L, HOT], 20, 54);
      },
      step(now) {
        const pose = swingPose(now);
        // Each shovelful lands on the strike, throwing coal into the mouth and
        // a few sparks back out.
        if (pose === 2 && prevPose !== 2) spawn(CENTRE - 4, MY + 10, 6, [EMBER, FLAME, COAL], 16, 26);
        prevPose = pose;
      },
      draw(now, blinking) {
        const pose = swingPose(now);
        const p = SWING[pose];
        const bob = swingBob(pose);
        const lift = bob < 0 ? 2 : 0;

        rect(12 + DX + lift, BASE, 32 - lift * 2, 1.5, SHADOW);
        rect(FX + 1.5, BASE, FW - 3, 1.5, SHADOW);

        drawFurnace(now);
        rect(66, 63, 7, 3, COAL);        // the pile he is working from
        drawClawd(bob, p.armDY, blinking, HAT.goggles);
        drawShovel(bob, p);
      },
    };
  }

  function makeRack() {
    const CHASSIS   = '#23262B';
    const CHASSIS_L = '#3A3F47';
    const UNIT      = '#2C3138';
    const SLOT      = '#171A1E';
    const LED_G     = '#5BE07A';
    const LED_A     = '#E8B54A';
    const LED_OFF   = '#1B2025';
    const FAN       = '#525A63';
    const SCREEN    = '#7FD4C4';

    const RKX = 74, RKY = 28, RKW = 26, RKH = 38;
    const UNITS = [32, 38, 44, 50];        // top of each 5-unit-tall bay
    const FAN_HUB = { x: 86, y: 60 };
    // Two opposing blades per pose, stepped through four grid-friendly angles.
    const BLADES = [
      [[-4, -1], [2, -1]],
      [[-3, -3], [1, 1]],
      [[-1, -4], [-1, 2]],
      [[1, -3], [-3, 1]],
    ];

    // The only thing this scene remembers. Everything else is the clock, which
    // is why it needs no `step` at all.
    let waveStart = -1e9;

    // No random: a deterministic hash keeps the blink lively but replayable.
    const lit = (u, i, phase) => ((((u * 7 + i * 13 + phase) * 2654435761) >>> 9) & 3) !== 0;

    return {
      accent: LED_G,
      celebrate(now) {
        waveStart = now;
        spawn(RKX + RKW / 2, RKY + 2, 14, [LED_G, SCREEN, LED_A], 18, 40);
      },
      draw(now, blinking) {
        // He is reading, not swinging: a slow shift of weight, nothing more.
        const bob = idleBob(now, 300);
        const lift = bob < 0 ? 2 : 0;
        const since = now - waveStart;

        rect(12 + DX + lift, BASE, 32 - lift * 2, 1.5, SHADOW);
        rect(RKX + 1.5, BASE, RKW - 3, 1.5, SHADOW);

        rect(RKX, RKY, RKW, RKH, CHASSIS);
        rect(RKX, RKY, RKW, 2, CHASSIS_L);
        rect(RKX, RKY + RKH - 2, RKW, 2, CHASSIS_L);

        const phase = Math.floor(now / 220);
        UNITS.forEach((uy, u) => {
          rect(77, uy, 20, 5, UNIT);
          rect(92, uy + 1, 4, 3, SLOT);
          // The wave sweeps bottom to top, so it reads as something rising
          // through the machine rather than a row of lights blinking at once.
          const washed = since >= 0 && since > (UNITS.length - 1 - u) * 90
                                    && since < (UNITS.length - 1 - u) * 90 + 700;
          for (let i = 0; i < 4; i++) {
            const on = washed || lit(u, i, phase);
            rect(79 + i * 3, uy + 1.5, 2, 2, on ? (i === 3 ? LED_A : LED_G) : LED_OFF);
          }
        });

        // Fan bay. It runs faster while the wave is passing.
        const fanPose = Math.floor(now / (since < 1400 ? 60 : 140)) % 4;
        rect(77, 56, 20, 8, UNIT);
        rect(FAN_HUB.x - 1, FAN_HUB.y - 1, 2, 2, CHASSIS_L);
        for (const [bx, by] of BLADES[fanPose]) {
          rect(FAN_HUB.x + bx, FAN_HUB.y + by, 2, 2, FAN);
        }

        drawClawd(bob, 0, blinking, HAT.headset);
        // A tablet in the near hand, angled at the rack.
        rect(64, 48 + bob, 8, 11, CHASSIS_L);
        rect(65, 49 + bob, 6, 8, SCREEN);
      },
    };
  }

  function makeDock() {
    const WATER   = '#12304C';
    const WATER_L = '#2A5C89';
    const DOCK    = '#6B4A30';
    const DOCK_L  = '#8B5E3C';
    const DOCK_D  = '#402A19';
    const MOON    = '#E8E4D0';
    const STAR    = '#8E9AA8';
    const LINE    = '#5A6472';
    const FISH    = '#9FD8E8';

    const TIP = { x: 88, y: 40 };
    const STARS = [[70, 34], [78, 30], [92, 46], [106, 40], [72, 50]];

    let dipUntil = 0, fishStart = -1e9;

    return {
      accent: MOON,
      celebrate(now) {
        dipUntil = now + 260;
        fishStart = now + 200;
        spawn(88, 62, 12, [WATER_L, FISH, MOON], 14, 34);
      },
      // No `step`, and deliberately no idle bob. He is sitting on a plank that
      // cannot bob with him, so a body rising a unit lifts off it and shows a
      // strip of decking underneath — the same seam the sitting pose exists to
      // close. The water and the float carry the motion instead.
      draw(now, blinking) {
        // Sky first: the moon and a few stars, well clear of the amount row.
        // Two overlapping rectangles rather than one, because a square moon
        // reads as a window and a crescent at eight units reads as a broken L.
        rect(97, 30, 6, 8, MOON);
        rect(96, 31, 8, 6, MOON);
        for (const [sx, sy] of STARS) rect(sx, sy, 1, 1, STAR);

        // Full-bleed, and then some. A sea exactly as wide as the stage leaves
        // a black wedge down one side and a black strip along the bottom as
        // soon as burn-in drift moves it; the canvas clips the overhang for
        // free. The highlights below stay inside the stage — a few units
        // without dashes at the very edge is not something anyone can see.
        rect(-4, 64, W + 8, H - 60, WATER);
        const slide = Math.floor(now / 700);
        for (let r = 0; r < 3; r++) {
          const off = (slide + r * 4) % 6;
          for (let x = 6; x <= 96; x += 12) rect(x + off, 65 + r * 3, 5, 1, WATER_L);
        }

        // Sitting is three things, and it stopped reading when any one was
        // missing. The plank's top face ends at the body's bottom edge, so his
        // own silhouette hides it and no strip of decking is left showing under
        // him; the front face below it is what he is sitting on the edge of; and
        // the posts carry the whole thing down past the waterline.
        const hip = BODY.y + BODY.h + OY;   // 60
        rect(4, hip - 3, 64, 3, DOCK);
        rect(4, hip - 3, 64, 1, DOCK_L);
        rect(4, hip, 64, 2, DOCK_D);
        rect(12, hip + 2, 3, 8, DOCK_D);
        rect(56, hip + 2, 3, 8, DOCK_D);

        // The third thing: legs starting at that same bottom edge, at the
        // standing legs' own x positions and widths. Started below the plank
        // instead they are correctly occluded and still wrong — the band of
        // decking left between body and leg reads as a character cut in half.
        drawClawd(0, 0, blinking, HAT.straw, { standing: false });
        LEGS.forEach(l => rect(l.x + OX, hip, l.w, 10, CORAL));

        blockLine(52 + DX, 35 + DY, TIP.x, TIP.y, 8, WOOD);

        const floatY = now < dipUntil ? 67 : 64 + (Math.floor(now / 1100) % 2);
        for (let y = TIP.y + 3; y < floatY; y += 2) rect(TIP.x, y, 1, 1, LINE);
        rect(TIP.x - 1, floatY, 3, 3, CORAL);

        // The catch arcs out of the water and back, once.
        const p = (now - fishStart) / 1100;
        if (p >= 0 && p <= 1) {
          const fx = snap(88 - 14 * p);
          const fy = snap(64 - 40 * p * (1 - p) * 2);
          rect(fx, fy, 5, 3, FISH);
          rect(fx + 5, fy + 0.5, 2, 2, FISH);
        }
      },
    };
  }

  // A slow shift of weight, for the scenes where Clawd is standing still and
  // watching something rather than hitting it. Two states a second apart, with
  // the phase in milliseconds so scenes do not all breathe in unison — added
  // inside the floor it would only ever flip the parity, and every even phase
  // would land back on the first one.
  const idleBob = (now, phase) => (Math.floor((now + phase) / 1000) % 2 === 0 ? 0 : -1);

  function makePrinter() {
    const CASE    = '#3F4348';
    const CASE_L  = '#5A6068';
    const CASE_D  = '#282C30';
    const PANEL   = '#15181A';
    const PAPER   = '#EFE7D6';
    const PAPER_D = '#C4B99E';
    const INK     = '#2B2723';
    const LED     = '#F2685C';
    const LED_OFF = '#4A2723';

    // The scenes that read at a glance are all one big mass with a saturated
    // colour in it: a dark furnace around a fire, a dark rack around its lights.
    // So the bill is the mass here, not the machine. A fan-folded stack of paper
    // beside Clawd, as tall as the figure, in the one warm off-white nothing
    // else on the stage uses.
    const SX = 64, SW = 16;            // the pile
    // Eight folds at most, so the pile tops out at 50 and the paper coming out
    // always has somewhere to fall. A taller pile would reach the slot, and the
    // feed is the whole point of the scene.
    const ROW = 2, MAX_ROWS = 8;
    const PX = 86, PY = 32, PW = 22, PH = 18;
    const SLOT = 36;                   // paper leaves the machine here
    const RIB = 39;                    // and hangs from here

    // Where the pile stops growing. A day and a month differ by two orders of
    // magnitude on this machine, so a linear pile is either invisible for a day
    // or off the stage by the second week; on a log scale ten dollars is a third
    // of the way up and a thousand fills it.
    const CAP = 1000;

    let feedUntil = 0;

    // The one place a scene reads the figure rather than the clock. Not state
    // this scene advances: the host sets it, and a display that repaints only
    // when it changes repaints exactly when this changes.
    function rows() {
      const cost = usage && typeof usage.cost === 'number' ? Math.max(0, usage.cost) : 0;
      const t = Math.min(1, Math.log10(1 + cost) / Math.log10(1 + CAP));
      return Math.round(t * MAX_ROWS);
    }

    return {
      accent: LED,
      celebrate(now) {
        feedUntil = now + 1000;
        spawn(77, RIB + 4, 8, [PAPER, PAPER_D, INK], 14, 30);
      },
      draw(now, blinking) {
        const bob = idleBob(now, 0);
        const lift = bob < 0 ? 2 : 0;
        const feeding = now < feedUntil;
        const n = rows();
        const top = BASE - n * ROW;

        rect(12 + DX + lift, BASE, 32 - lift * 2, 1.5, SHADOW);
        rect(SX + 1, BASE, SW - 2, 1.5, SHADOW);
        rect(PX + 2, BASE, PW - 4, 1.5, SHADOW);

        // Every other sheet sits two units proud, which is what a concertina
        // looks like from the side and what a flat block of white does not.
        for (let i = 0; i < n; i++) {
          const y = BASE - (i + 1) * ROW;
          const odd = i % 2 === 1;
          rect(SX + (odd ? 2 : 0), y, SW - 2, ROW, odd ? PAPER_D : PAPER);
          rect(SX + (odd ? 4 : 2), y + 0.5, 8, 1, INK);
        }

        // Nothing lands on the pile, deliberately. The pile's height is the
        // figure, so it cannot actually grow, and every way of animating a sheet
        // arriving onto a pile that does not grow ends the same: the sheet has
        // to be taken away again, and taking it away is a pop once a second. The
        // pile is the record of what has been printed and holds still; the paper
        // is the printing and never does.

        // Machine: a dark box on legs, feeding out of its left face.
        rect(PX, PY, PW, PH, CASE);
        rect(PX - 1, PY - 3, PW + 2, 3, CASE_L);
        rect(PX + 4, PY + PH, 4, BASE - PY - PH, CASE_D);
        rect(PX + PW - 8, PY + PH, 4, BASE - PY - PH, CASE_D);
        // A head scanning back and forth behind the window. Six steps for four
        // positions, so it turns round at each end instead of snapping back.
        rect(PX + 4, PY + 4, 14, 5, PANEL);
        const s = Math.floor(now / 130) % 6;
        rect(PX + 5 + (s < 4 ? s : 6 - s) * 3, PY + 5, 3, 3, CASE_L);
        // Three lamps, all lit while it feeds and one at a time otherwise. The
        // only saturated thing on the machine, and the scene's accent.
        for (let i = 0; i < 3; i++) {
          const on = feeding || Math.floor(now / 400) % 3 === i;
          rect(PX + 6 + i * 4, PY + 11, 2, 2, on ? LED : LED_OFF);
        }
        // The output slot, with a roller turning inside it.
        rect(PX - 2, SLOT, 4, 4, PANEL);
        rect(PX - 2, SLOT + (Math.floor(now / 175) % 2) * 2, 4, 2, CASE_L);

        // The paper. Its length is fixed: a ribbon that grew and then snapped
        // back to nothing every cycle read as a glitch, because that is what a
        // sawtooth looks like. What moves is what is printed on it. The lines
        // are identical and evenly spaced, so one leaving the bottom as another
        // enters the top has no seam — the same trick as the conveyor's tread,
        // and the only kind of loop that survives being watched for an hour.
        // Set in from the pile's right edge rather than flush with it: the pile
        // shifts two units every other sheet, so a flush ribbon overhangs it on
        // odd row counts and leaves a notch of background under its corner.
        rect(72, SLOT + 1, PX - 72, 2, PAPER);
        rect(72, RIB, 6, Math.max(2, top - RIB), PAPER);
        const off = Math.floor(now / 90) % 4;
        for (let y = RIB + off; y < top; y += 4) {
          rect(73, y, 4, 1, INK);
          if (y + 2 < top) rect(73, y + 2, 2, 1, INK);   // a second column
        }

        drawClawd(bob, 0, blinking, HAT.visor);
      },
    };
  }

  function makeBelt() {
    const FRAME   = '#3A4046';
    const FRAME_L = '#565E66';
    const BELT    = '#22262A';
    const TREAD   = '#454C52';
    const BOX     = '#B98149';
    const BOX_D   = '#8C6035';
    const TAPE    = '#D9C08F';
    const INK     = '#5B4478';
    const INK_L   = '#B98CF0';

    // A conveyor running past Clawd, low enough that a parcel's lid is just
    // under his hand. Reaching for one across the stage needed a handle four
    // times the length of the stamp head, which is a selfie stick.
    const BX = 50, BW = 54, TOP = 62;
    const TICK = 140, SPAN = 40, BOXW = 7, BOXH = 7, N = 4;
    // Four parcels ten units apart, moving two units a tick: one is under the
    // stamp every five ticks, and `k % 5` is the whole rhythm of the scene. The
    // stamp column is twelve units along, which puts that parcel directly in
    // front of him.
    const STAMP_AT = 12, STRIKE = 1;   // (2k + 10i) % 40 === 12 iff k % 5 === 1
    const offset = (k, i) => (k * 2 + i * 10) % SPAN;
    const LID = TOP - BOXH;            // the surface the stamp meets
    // The parcels wrap from the end of their travel back to the start. Both ends
    // are boxed in so that jump happens out of sight: uncovered, a parcel
    // vanishes from mid-belt once every five ticks, in lockstep with the stamp.
    const HOOD = 12, CHUTE = 88;

    let inkUntil = 0;

    return {
      accent: INK_L,
      celebrate(now) {
        inkUntil = now + 900;
        spawn(BX + STAMP_AT + 3, LID, 10, [INK_L, INK, TAPE], 16, 34);
      },
      draw(now, blinking) {
        const k = Math.floor(now / TICK);
        const beat = k % 5;
        // Down on the beat, and one tick either side of it on the way.
        // Clawd's hand sits at y 51 to 57, so a parcel lid has to be under that
        // for him to press down on one at all. That fixes the height of the
        // whole conveyor, and it is why it is a low one.
        const armDY = beat === STRIKE ? -1
                    : beat === 0 || beat === 2 ? -4 : -8;
        const bob = beat === STRIKE ? 1 : 0;
        const inking = now < inkUntil;

        rect(12 + DX, BASE, 32, 1.5, SHADOW);

        // It stands on the floor rather than on legs: with four units between
        // the rail and the ground, legs would read as a wobble.
        rect(BX, TOP, BW, 2, FRAME_L);
        rect(BX, TOP + 2, BW, BASE - TOP - 2, BELT);
        for (let x = (k * 2) % 6; x < BW; x += 6) {
          rect(BX + x, TOP + 2, 2, 2, TREAD);
        }

        for (let i = 0; i < N; i++) {
          const o = offset(k, i);
          const px = BX + o;
          rect(px, LID, BOXW, BOXH, BOX);
          rect(px, TOP - 2, BOXW, 2, BOX_D);
          rect(px + 3, LID, 1, BOXH, TAPE);
          // Already past the stamp, so it carries a mark. Derived from where it
          // is rather than remembered, which is why it survives a still frame.
          if (o >= STAMP_AT) rect(px + 1, LID + 1, 5, 2, inking ? INK_L : INK);
        }

        // Feeder and chute, over the parcels: one hides the position they wrap
        // to, the other the position they wrap from.
        rect(BX, LID - 2, HOOD, TOP - LID + 2, FRAME);
        rect(BX, LID - 2, HOOD, 2, FRAME_L);
        rect(CHUTE, LID - 2, BX + BW - CHUTE, TOP - LID + 2, FRAME);
        rect(CHUTE, LID - 2, BX + BW - CHUTE, 2, FRAME_L);

        drawClawd(bob, armDY, blinking, HAT.cap);
        // The stamp, and the proportions are the whole point: a head two and a
        // half times the width of its grip, and a grip his hand closes on.
        const sy = bob + armDY + 1;            // 0 at the bottom of the swing
        rect(62, 46 + sy, 6, 2, WOOD);         // knob
        rect(63, 48 + sy, 4, 4, WOOD);         // grip
        rect(60, 52 + sy, 10, 3, STEEL);       // head
        rect(60, 54 + sy, 10, 1, STEEL_L);     // the face that meets the lid
      },
    };
  }

  function makeUplink() {
    const MAST   = '#5A6068';
    const RIM    = '#8A929B';
    const FACE   = '#3B4650';
    const FACE_L = '#5E6A76';
    const HORN   = '#B9C2CB';
    const PAD    = '#2C3138';
    const SCREEN = '#2F6C8C';
    // Never off, only dim. A dish whose throat goes black between pulses is a
    // dark disc on a dark stage for three quarters of every second.
    const SIG    = '#2A5C78';
    const SIG_L  = '#5FC8F5';

    // Face on, pointed at whoever is watching. A dish in profile is a thin
    // curved sliver at this size and reads as a hook; head on it is the widest
    // solid mass the right-hand side can hold, and three shells of it can light
    // in turn so a pulse leaves the middle and runs out to the rim.
    //
    // Aimed up rather than sideways would put the signal through the amount row,
    // which reaches y 24 at its tallest. Everything here stays below 29.
    const CX = 90;                  // the dish is symmetrical about this

    let pingUntil = 0;

    return {
      accent: SIG_L,
      celebrate(now) {
        pingUntil = now + 1100;
        spawn(CX, 34, 12, [SIG_L, SCREEN, HORN], 18, 40);
      },
      draw(now, blinking) {
        const bob = idleBob(now, 600);
        const lift = bob < 0 ? 2 : 0;
        // The dish nods, which is the only idle motion it has.
        const nod = Math.floor(now / 2300) % 2;
        const pinging = now < pingUntil;
        // Outward: throat, then the face, then the rim, then a beat of nothing.
        const p = Math.floor(now / 240) % 4;
        const lit = i => pinging || p === i;

        rect(12 + DX + lift, BASE, 32 - lift * 2, 1.5, SHADOW);
        rect(82, BASE, 16, 1.5, SHADOW);

        // One unit taller than the dish's resting bottom edge, because the nod
        // lifts the dish and would otherwise open a gap above the pole.
        rect(88, 49, 4, 13, MAST);
        rect(82, 62, 16, 4, PAD);

        // Three shells, largest first, each painted over the middle of the last
        // so lighting one lights a ring rather than a disc. Three rects per
        // shell rather than two: at 28 units across, a two-rect octagon still
        // has square enough corners to read as a screen on a stand.
        const back = lit(2) ? SIG_L : FACE;
        rect(80, 30 - nod, 20, 20, back);
        rect(78, 32 - nod, 24, 16, back);
        rect(76, 34 - nod, 28, 12, back);
        // A lit upper rim, the same cue the jetty's moon uses: without it a grey
        // octagon on a near-black stage has no edge to catch.
        rect(80, 30 - nod, 20, 2, lit(2) ? SIG_L : RIM);
        const mid = lit(1) ? SIG_L : FACE_L;
        rect(83, 33 - nod, 14, 14, mid);
        rect(81, 35 - nod, 18, 10, mid);
        rect(84, 36 - nod, 12, 8, lit(0) ? SIG_L : SIG);

        // Struts to the focus, then the feed horn over them. Without these it is
        // a lit disc on a pole, which is a lamp.
        rect(89, 30 - nod, 2, 8, MAST);
        rect(76, 39 - nod, 11, 2, MAST);
        rect(93, 39 - nod, 11, 2, MAST);
        rect(87, 38 - nod, 6, 4, HORN);
        rect(87, 38 - nod, 6, 1, RIM);

        drawClawd(bob, 0, blinking, HAT.beanie);
        // A handset, so he is aiming the thing rather than standing near it.
        rect(62, 46 + bob, 9, 14, PAD);
        rect(63, 48 + bob, 7, 7, pinging ? SIG_L : SCREEN);
        rect(64, 56 + bob, 5, 2, FACE_L);
        rect(69, 41 + bob, 2, 5, MAST);        // stub aerial
      },
    };
  }

  function makeDojo() {
    // Barely above the background on purpose. Its job is to hide the throw and
    // the landing, not to be a slab across the bottom of the picture.
    const MAT     = '#1C1815';
    const MAT_L   = '#2A241F';
    // The only scene with a floor, so the only one where the ground is not the
    // background. Everywhere else the "shadow" has to be lighter than the stage
    // because there is nothing darker; here there is.
    const SHADE   = '#100D0B';
    const EDGE    = '#DCE6EE';
    const TRAIL   = '#525C68';
    const JUICE   = '#FFB8D0';

    const FRUIT = [
      { skin: '#3E7A3A', flesh: '#FF6FA5', lit: '#67A45F', dark: '#2A5628' },  // melon
      { skin: '#D9782A', flesh: '#F5A64E', lit: '#EFA05A', dark: '#A2551A' },  // orange
      { skin: '#C9B23C', flesh: '#F3E58A', lit: '#E4D171', dark: '#95822A' },  // lemon
      { skin: '#6B4A8C', flesh: '#A87CC6', lit: '#8E68AC', dark: '#4C3465' },  // plum
    ];

    // Three fruit spread over one cycle, so one is at the top of its arc every
    // 700 ms and the stage is never empty. Both the throw and the swing come off
    // that single number, which is what keeps the blade landing on a fruit
    // rather than near one.
    const CYCLE = 2100, N = 3, BEAT = CYCLE / N;
    // Clawd stands in the middle of the stage for this one, which no other scene
    // does, and the fruit come in from both edges towards him. Ten by eight is a
    // little over a quarter of his body: smaller than that and a fruit is a
    // coloured pip rather than a thing being cut in half.
    const SHIFT = 15;                  // his centre from 41 to the stage's 56
    // Everything about the swords hangs off these two rather than off the
    // literals 56 and 24. Written out, changing SHIFT moved the figure and left
    // both blades floating where his hands used to be.
    const CX = OX + BODY.x + BODY.w / 2 + SHIFT;
    const HAND = 24;                   // each hand, out from his centre
    // One arc on each side, mirrored about him, launching near an edge and
    // arcing inwards. Neither reaches him: they are drawn behind him, so an arc
    // that crossed him would take the fruit out of sight for half its flight.
    const OUT_L = 6, OUT_R = 96, TRAVEL = 16, RISE = 34;
    // The celebration's own arc, right across the stage and higher than theirs.
    const BONUS_FROM = 4, BONUS_SPAN = 94, BONUS_RISE = 38;
    // Thrown from under the floor and landing back under it. That is what makes
    // the loop seamless: a fruit is never visible at the moment its phase wraps,
    // and nothing ever has to leave the stage to sell it.
    const arcX = (from, span, p) => snap(from + span * p);
    const arcY = (rise, p) => snap(BASE - rise * 4 * p * (1 - p));

    const flight = (now, i) => Math.floor(now / CYCLE + i / N);
    const phase = (now, i) => (now / CYCLE + i / N) % 1;
    const kind = (now, i) => FRUIT[(flight(now, i) + i) % FRUIT.length];
    // Which side a fruit comes in on, and which side the blade goes to, are the
    // same number reached two ways. A fruit's flight tops out on the beat
    // `3 * flight + 1 - i`, so its side is that beat's parity, and the swing
    // takes the parity of the beat it is in. They cannot disagree.
    const fromLeft = (now, i) => (flight(now, i) + i + 1) % 2 === 0;

    // Blade direction per pose. Only the direction: the length is normalised in
    // drawSword, because these vectors are not the same magnitude and scaling
    // them raw grew and shrank the blade by 41% once a beat, which is the very
    // thing aiming the tip at a fixed spot would have done. The left-hand blade
    // mirrors the x of all of it.
    const SLASH = [
      { dir: [2, -2],  armDY: -6  },   // 0 through the fruit
      { dir: [3, 1],   armDY: -2  },   // 1 follow through, down
      { dir: [0, -1],  armDY: -8  },   // 2 recovering, straight up
      { dir: [1, -2],  armDY: -10 },   // 3 raised, ready
    ];
    // He holds one in each hand and only one of them swings. A single sword
    // changing hands on the beat is a sword that teleports every 700 ms, and no
    // pose hides that.
    const GUARD = { dir: [1, -2], armDY: -6 };
    const PREV = [3, 0, 1, 2];
    const BLADE = 14;                  // hand to tip, the same in every pose

    let prevSp = 0, bonusAt = -1e9;

    // Clipped at the floor line rather than drawn through it. Below that line
    // the mat covers everything anyway, so this changes nothing you can see, and
    // it is what lets the fruit be big enough to read: drawn whole, a fruit
    // waiting under the floor hangs past the bottom of the stage.
    const bit = (x, y, w, h, c) => {
      const cut = Math.min(h, BASE - y);
      if (cut > 0) rect(x, y, w, cut, c);
    };

    function drawFruit(x, y, f, sep) {
      if (sep === null) {
        bit(x + 2, y, 6, 8, f.skin);
        bit(x + 1, y + 1, 8, 6, f.skin);
        bit(x, y + 2, 10, 4, f.skin);
        bit(x + 1, y + 6, 8, 1, f.dark);
        bit(x + 2, y + 1, 3, 2, f.lit);
        return;
      }
      // Halves, opening from the middle. The cut face is the only place the
      // flesh colour shows, which is why an uncut fruit reads as one lump.
      bit(x + 2 - sep, y, 3, 8, f.skin);
      bit(x + 1 - sep, y + 1, 4, 6, f.skin);
      bit(x - sep, y + 2, 5, 4, f.skin);
      bit(x + 4 - sep, y + 1, 1, 6, f.flesh);
      bit(x + 5 + sep, y, 3, 8, f.skin);
      bit(x + 5 + sep, y + 1, 4, 6, f.skin);
      bit(x + 5 + sep, y + 2, 5, 4, f.skin);
      bit(x + 5 + sep, y + 1, 1, 6, f.flesh);
    }

    // Half a beat out of step with the beat itself: a fruit reaches the top of
    // its arc in the middle of its beat, not at the start of one.
    const swingPhase = now => ((now % BEAT) / BEAT + 0.5) % 1;

    // `side` is -1 for the left hand and 1 for the right. A pose of -1 means
    // this hand is the one not working, and holds its guard.
    function drawSword(side, pose) {
      const s = pose < 0 ? GUARD : SLASH[pose];
      const hx = CX + side * HAND;
      const hy = 35 + DY + s.armDY;
      // Only x mirrors, and only the direction is taken from the pose.
      const tip = d => {
        const len = Math.hypot(d[0], d[1]);
        return [hx + (d[0] / len) * BLADE * side, hy + (d[1] / len) * BLADE];
      };
      if (pose === 0 || pose === 1) {
        const [bx, by] = tip(SLASH[PREV[pose]].dir);
        rect(snap(bx) - 1.5, snap(by) - 1.5, 3, 3, TRAIL);
      }
      const [cx, cy] = tip(s.dir);
      // From the first step rather than the second, so the blade meets the grip.
      // At a seventh of fourteen units the second step is four out, and the grip
      // only reaches two.
      blockLine(hx, hy, cx, cy, 7, STEEL, 1);
      rect(snap(cx) - 1.5, snap(cy) - 1.5, 3, 3, EDGE);
      rect(hx - 2, hy - 1.5, 4, 3, WOOD);    // the grip, in his hand
    }

    return {
      accent: FRUIT[0].flesh,
      celebrate(now) {
        // One more, on an arc right across the stage and in front of everything,
        // Clawd included. Behind him it spent half its flight inside his head:
        // there is no arc that clears both his headband and the amount row.
        // It starts under the floor like the others, so it arrives without
        // appearing from nowhere.
        bonusAt = now;
        spawn(CX, 38, 12, [FRUIT[0].flesh, JUICE, FRUIT[0].skin], 26, 36);
      },
      // The one thing that cannot be derived: the instant a blade goes through,
      // which is an edge rather than a position.
      step(now) {
        const sp = swingPhase(now);
        if (sp < prevSp) {
          let cut = 0;
          for (let i = 1; i < N; i++) {
            if (Math.abs(phase(now, i) - 0.5) < Math.abs(phase(now, cut) - 0.5)) cut = i;
          }
          const f = kind(now, cut);
          // Where the halves part, which is the fruit's middle: `drawFruit`
          // opens them either side of x + 5, and the apex puts x at OUT ± 8.
          const at = fromLeft(now, cut) ? OUT_L + TRAVEL / 2 + 5
                                        : OUT_R - TRAVEL / 2 + 5;
          spawn(at, 38, 9, [f.flesh, f.skin, JUICE], 22, 32);
        }
        prevSp = sp;
      },
      draw(now, blinking) {
        const sp = swingPhase(now);
        const pose = sp < 0.12 ? 0 : sp < 0.30 ? 1 : sp < 0.62 ? 2 : 3;
        // Which hand is working. Held for the whole beat, so the swing never
        // changes sides part way through itself.
        const left = Math.floor(now / BEAT) % 2 === 0;

        // Fruit first. The floor goes over them, and that is what hides both the
        // throw and the landing.
        for (let i = 0; i < N; i++) {
          const p = phase(now, i);
          const x = fromLeft(now, i) ? arcX(OUT_L, TRAVEL, p) : arcX(OUT_R, -TRAVEL, p);
          drawFruit(x, arcY(RISE, p), kind(now, i),
                    p <= 0.5 ? null : Math.round((p - 0.5) * 20));
        }
        rect(-4, BASE, W + 8, H - BASE + 4, MAT_L);
        rect(-4, BASE + 1, W + 8, H - BASE + 3, MAT);
        rect(12 + DX + SHIFT, BASE, 32, 1.5, SHADE);

        drawClawd(0, left ? GUARD.armDY : SLASH[pose].armDY, blinking, HAT.headband,
                  { dx: SHIFT, armLDY: left ? SLASH[pose].armDY : GUARD.armDY });

        drawSword(-1, left ? pose : -1);
        drawSword(1, left ? -1 : pose);

        // The bonus goes over the top of all of it, Clawd included.
        const bp = (now - bonusAt) / CYCLE;
        if (bp >= 0 && bp <= 1) {
          drawFruit(arcX(BONUS_FROM, BONUS_SPAN, bp), arcY(BONUS_RISE, bp), FRUIT[0], null);
        }
      },
    };
  }

  function makeDuckHunt() {
    const TREE    = '#1A2A1C';
    const GRASS   = '#24401F';
    const GRASS_L = '#33552B';
    const TUFT    = '#A8D84A';
    const DUCK    = '#2A2E3A';
    const WING    = '#4A5265';
    const BELLY   = '#C9CEDA';
    const BEAK    = '#E8A23A';
    const FLASH   = '#F4F7FF';
    const AIM     = '#8E9BAA', AIM_L = '#DDE5EF';

    // Nobody is holding a gun, which is the game: the player is off the screen
    // with the Zapper and the only three things on it are a duck, a dog and the
    // sight the player is looking down. Clawd is the dog. What says a shot
    // happened is what said it in 1985, the duck going white for a frame and
    // then dropping like a stone.
    //
    // One flight every 3.6 s, and the whole beat inside it: flush, climb, hit,
    // fall, retrieve. A single duck at a time, like Game A.
    const CYCLE = 3600;
    const CLIMB = [0.06, 0.52];        // out of the grass to the top of the climb
    const STUN = 0.58, LANDED = 0.74;  // frozen until STUN, in the grass by LANDED
    const FETCH = 0.76;                // Clawd comes up with it

    // The grass hides the launch and the landing, so no part of a flight is ever
    // visible at the moment its phase wraps. Both bands reach the bottom of the
    // stage, which is what lets them run past its sides.
    //
    // The turf is low and Clawd stands well to the right, because he is 36 units
    // wide on a 112 unit stage and this is the one scene whose subject is the
    // empty part. Chest deep and off to one side, the sky is 28 units tall and
    // the duck has somewhere to be.
    const TREES = 52, TURF = 60;
    const SHIFT = 26;
    const D_X0 = 6, D_X1 = 42, D_LOW = 63, D_TOP = 30;

    // Where the sight waits, in the middle of the empty half. It wanders a unit
    // on two different clocks, which is enough to stop it looking nailed on.
    const REST_X = 26, REST_Y = 40;
    const SEEN = 0.16, LOCK = 0.38;    // notices the bird, then has it
    const HOME = [0.56, 0.72];         // and swings back after the shot

    let prevP = 0, cheerAt = -1e9;

    const at = now => (now / CYCLE) % 1;
    const span = (p, a, b) => Math.max(0, Math.min(1, (p - a) / (b - a)));

    // Three wing positions off the clock, and a two unit waver: a duck that
    // climbs in a clean line is a paper aeroplane.
    const waver = now => (Math.floor(now / 190) % 3 - 1) * 2;

    // Clipped at the turf line rather than drawn through it. The grass covers
    // that part anyway, so this changes nothing anyone sees; what it buys is a
    // duck big enough to read. Thirteen wide and fourteen tall wing tip to wing
    // tip, and one waiting under the turf hangs off the bottom of the stage.
    const bit = (x, y, w, h, c) => {
      const cut = Math.min(h, TURF - y);
      if (cut > 0) rect(x, y, w, cut, c);
    };

    // `y` is the top of the head.
    function drawDuck(x, y, wing, tint) {
      const body = tint || DUCK;
      bit(x + 1, y + 4, 12, 3, body);
      bit(x + 2, y + 3, 9, 5, body);
      bit(x + 9, y, 4, 4, body);               // head
      bit(x + 12, y + 1, 2, 2, tint || BEAK);
      bit(x + 3, y + 6, 6, 1, tint || BELLY);
      if (wing === 0) bit(x + 4, y - 3, 5, 4, tint || WING);
      else if (wing === 1) bit(x + 4, y + 2, 6, 3, tint || WING);
      else bit(x + 5, y + 7, 5, 4, tint || WING);
    }

    // Where the duck is at a point along the climb, as the centre of it rather
    // than a corner, because that is what the sight has to agree with.
    // Centred on the body rather than on the bounding box, which is a head and
    // a wing higher than where anyone would aim.
    const flight = (c, now) => ({
      x: snap(D_X0 + (D_X1 - D_X0) * c) + 7.5,
      y: snap(D_LOW - (D_LOW - D_TOP) * c * (2 - c)) + waver(now) + 5.5,
    });

    // Still no gun, but somebody is holding one, and this is the only thing on
    // the stage that says so.
    //
    // It does not follow the bird. It sits where it was left, in the middle of
    // the empty half, and stays there through the flush, because a person does
    // not have the duck until they have seen it. Then it goes and gets it: fast
    // out of the gate, slow into the target, on it for a beat, fire. A sight
    // welded to the duck from the moment it clears the grass is a turret, and
    // the shot never becomes possible because it was always possible.
    //
    // A ring seven across with a bright pip at its centre. The ring says where
    // the attention is; the pip is the pixel it is actually on, and without it a
    // ring is a region rather than a point. A circle on a grid this coarse has
    // to be spelled out, so these are the runs of a seven by seven one as
    // offsets from its top left corner, which is shorter than the arithmetic
    // and rounder than what the arithmetic gives.
    const RING = [
      [2, 0, 3, 1], [2, 6, 3, 1],   // caps
      [1, 1, 1, 1], [5, 1, 1, 1],   // shoulders
      [1, 5, 1, 1], [5, 5, 1, 1],
      [0, 2, 1, 3], [6, 2, 1, 3],   // sides
    ];
    // Fast then slow, which is what a hand does and a motor does not.
    const flick = t => 1 - Math.pow(1 - t, 3);
    // Snapped, because a blend lands anywhere and the renderer wants halves.
    const toward = (from, to, k) => snap(from + (to - from) * k);
    // One colour throughout, including over the white of the hit: the ring going
    // white too would lose it in the bird at the one instant it is the point.
    function drawAim(cx, cy) {
      for (const [dx, dy, w, h] of RING) bit(cx - 3.5 + dx, cy - 3.5 + dy, w, h, AIM);
      bit(cx - 0.5, cy - 0.5, 1, 1, AIM_L);
    }

    return {
      accent: TUFT,
      celebrate(now) {
        // He comes up with two of them, which is what the dog does when both
        // ducks of a pair are hit.
        cheerAt = now;
        // Over Clawd rather than over the shot: this burst belongs to the
        // handing over, and the shot happens well to the left of him.
        spawn(SHIFT + 40, 38, 12, [BELLY, WING, TUFT], 20, 34);
      },
      // Feathers at the shot, which is an edge rather than a position.
      step(now) {
        const p = at(now);
        if (prevP < CLIMB[1] && p >= CLIMB[1]) {
          spawn(D_X1 + 5, 34, 8, [BELLY, WING, DUCK], 18, 30);
        }
        prevP = p;
      },
      draw(now, blinking) {
        const p = at(now);

        // Distant cover, drawn to the bottom so it qualifies as a backdrop and
        // can overhang the sides. The humps go on top of it and stay inside.
        rect(-4, TREES, W + 8, H - TREES + 4, TREE);
        for (let x = 5; x < 100; x += 13) rect(x, TREES - 3, 9, 3, TREE);

        // Clawd, chest deep and watching. Out of the grass to hand it over.
        const fetch = span(p, FETCH, 1);
        const lift = fetch < 0.25 ? fetch / 0.25
                   : fetch > 0.8 ? (1 - fetch) / 0.2 : 1;
        const bob = Math.round(8 - 10 * lift) + (lift ? 0 : Math.floor(now / 500) % 2);
        drawClawd(bob, 0, blinking, HAT.hunter, { dx: SHIFT, standing: false });

        // What he came up with. Two of them when the counter has just risen,
        // which is the pose for a pair brought back together.
        //
        // Settled once, at the instant this retrieval opens, rather than tested
        // afresh every frame. `cheerAt` is a wall clock and the pose is a fixed
        // phase, so a window measured from one lands its edge in the middle of
        // the other, and a duck appears or vanishes in his hands with nothing on
        // screen to explain it. A rise that arrives after the window has opened
        // waits for the next one, which is the right way round anyway: he has
        // to go and get them.
        if (lift > 0.5) {
          const opened = Math.floor(now / CYCLE) * CYCLE + FETCH * CYCLE;
          if (opened - cheerAt >= 0 && opened - cheerAt < CYCLE) {
            drawDuck(52, 42 + bob, 1, null);
            drawDuck(68, 42 + bob, 1, null);
          } else {
            drawDuck(60, 42 + bob, 1, null);
          }
        }

        // The duck, in front of Clawd. Behind him it would vanish into his chest
        // halfway up the climb; in front it simply passes close.
        const climb = span(p, CLIMB[0], CLIMB[1]);
        const hit = p >= CLIMB[1] && p < CLIMB[1] + 0.02;
        if (p < CLIMB[1]) {
          const bird = flight(climb, now);
          drawDuck(bird.x - 7.5, bird.y - 5.5, Math.floor(now / 120) % 3, null);
        } else if (p < LANDED) {
          // Hit: white for a beat, then stunned, then straight down with the
          // wing still up, which is the sprite everyone remembers.
          const fall = span(p, STUN, LANDED);
          drawDuck(D_X1, snap(D_TOP + (D_LOW - D_TOP) * fall * fall), 0,
                   hit ? FLASH : null);
        }

        // The sight, over the duck and over Clawd both: it is on the glass, not
        // in the field. Every position it takes is a blend between where it
        // rests and where the bird is, so it remembers nothing between frames.
        const rx = REST_X + (Math.floor(now / 1300) % 3 - 1);
        const ry = REST_Y + (Math.floor(now / 900) % 3 - 1);
        const shotX = D_X1 + 7.5, shotY = D_TOP + 5.5;
        if (p < CLIMB[1]) {
          const bird = flight(climb, now);
          const k = flick(span(p, SEEN, LOCK));
          drawAim(toward(rx, bird.x, k), toward(ry, bird.y, k));
        } else if (hit) {
          drawAim(shotX, shotY);
        } else if (p >= HOME[0]) {
          // Off the target and back to where it waits. Between the shot and
          // this it is not drawn at all, which is the flinch.
          const k = flick(span(p, HOME[0], HOME[1]));
          drawAim(toward(shotX, rx, k), toward(shotY, ry, k));
        }

        // Turf last, over all of it: it is what hides the launch, the landing
        // and his legs. Lit edge first and then the body over it, both to the
        // bottom, because a two unit strip on its own is not a backdrop.
        rect(-4, TURF, W + 8, H - TURF + 4, GRASS_L);
        rect(-4, TURF + 2, W + 8, H - TURF + 2, GRASS);
        // Blades standing proud of it, in the one saturated colour here.
        for (let x = 4; x < 106; x += 13) {
          rect(x, TURF - 3, 1, 4, TUFT);
          rect(x + 6, TURF - 2, 1, 3, GRASS_L);
        }
      },
    };
  }

  const SCENES = {
    mine: makeMine(),
    forge: makeForge(),
    rack: makeRack(),
    dock: makeDock(),
    printer: makePrinter(),
    belt: makeBelt(),
    uplink: makeUplink(),
    dojo: makeDojo(),
    duckhunt: makeDuckHunt(),
  };
  const scene = SCENES[window.CLAWD_SCENE] || SCENES.mine;

  function draw(now) {
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W * S, H * S);

    scene.draw(now, now < blinkUntil);

    for (const b of bits) rect(Math.round(b.x * 2) / 2, Math.round(b.y * 2) / 2, 1.5, 1.5, b.c);
    drawAmount(now);
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000 || 0);
    lastT = now;
    updateDrift(now);

    if (!reduced) {
      // Optional: a scene whose every moving part is a function of the clock
      // has nothing to advance, and saying so is more honest than an empty one.
      if (scene.step) scene.step(now, dt);
      stepBlink(now);
      stepBits(dt);
    }

    draw(now);
    if (!STATIC) requestAnimationFrame(frame);
  }

  addEventListener('resize', () => { resize(); if (STATIC) draw(performance.now()); });
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
